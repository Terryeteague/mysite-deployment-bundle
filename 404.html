<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page not found — MySite" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 — Page Not Found | MySite</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --primary: #6366f1; --accent: #06b6d4; --text: #f1f5f9; --muted: #94a3b8; --radius: 1rem; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 3rem 2.5rem; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: rise .5s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    .code { font-size: 6rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.5rem; }
    .icon { font-size: 3rem; margin-bottom: 1rem; display: block; animation: wobble 2.5s ease-in-out infinite; }
    @keyframes wobble { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: var(--muted); line-height: 1.75; margin-bottom: 2rem; font-size: 0.95rem; }
    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; padding: 0.65rem 1.4rem; border-radius: 0.6rem; font-size: 0.9rem; font-weight: 600; text-decoration: none; transition: transform .2s; }
    .btn--primary { background: var(--primary); color: #fff; }
    .btn--ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon" aria-hidden="true">🔍</span>
    <div class="code" aria-label="404">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="actions">
      <a href="/" class="btn btn--primary">← Go Home</a>
      <button onclick="history.back()" class="btn btn--ghost">Go Back</button>
    </div>
  </div>
</body>
</html>
