# ============================================================
# nginx-docker.conf — Container-specific Nginx config
# MySite Deployment Bundle
# ============================================================
# This config is used INSIDE the Docker container (port 80).
# SSL termination is handled by the host or a reverse proxy
# (e.g. Traefik, Caddy, AWS ALB) in front of the container.
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root  /usr/share/nginx/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log  warn;

    # Security Headers
    add_header X-Frame-Options              "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options       "nosniff"                            always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';"
        always;

    # Gzip Compression
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml font/woff2;

    # Static Asset Caching
    location ~* \.(css|js|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # SPA / Clean URLs
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # Block Hidden Files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Custom Error Pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
}
