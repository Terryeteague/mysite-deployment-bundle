# ============================================================
# nginx.conf — Production Nginx Configuration
# Machine Design AI Assistant
# ============================================================
# Place at: /etc/nginx/sites-available/machinedesignai.conf
# Symlink:  ln -s /etc/nginx/sites-available/machinedesignai.conf /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx
# ============================================================

# Rate limiting zone (10 MB shared memory, 30 req/s per IP)
limit_req_zone $binary_remote_addr zone=site_limit:10m rate=30r/s;

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name machinedesignai.com www.machinedesignai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name machinedesignai.com www.machinedesignai.com;

    root /var/www/mdai/public;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/machinedesignai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/machinedesignai.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/machinedesignai.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options              "SAMEORIGIN"                                always;
    add_header X-Content-Type-Options       "nosniff"                                   always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"           always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()"  always;
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    access_log /var/log/nginx/mdai_access.log combined;
    error_log  /var/log/nginx/mdai_error.log  warn;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    limit_req zone=site_limit burst=50 nodelay;

    location ~* \.(css|js|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
}
