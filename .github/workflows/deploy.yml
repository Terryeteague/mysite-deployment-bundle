# ============================================================
# deploy.yml - GitHub Actions CI/CD Pipeline
# MySite Deployment Bundle
# ============================================================
# Triggers:
#   Push to main  -> build + deploy to Production
#   Push to dev   -> build + deploy to Staging
#   Pull Request  -> lint + validate only (no deploy)
#
# Required GitHub Secrets:
#   SSH_HOST          Production server IP or hostname
#   SSH_USER          SSH username (e.g. ubuntu, deploy)
#   SSH_PRIVATE_KEY   Private key for SSH access
#   SSH_PORT          SSH port (default 22)
#   STAGING_HOST      Staging server IP or hostname
#   SLACK_WEBHOOK     (Optional) Slack incoming webhook URL
# ============================================================

name: CI / CD - MySite

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: mysite
  REGISTRY:   ghcr.io/${{ github.repository_owner }}

jobs:

  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          echo "Checking for required HTML elements..."
          grep -q '<html lang=' index.html         || (echo "Missing lang attribute on html" && exit 1)
          grep -q '<meta name="description"'  index.html || (echo "Missing meta description"  && exit 1)
          grep -q 'skip-link'                 index.html || (echo "Missing skip-link"          && exit 1)
          echo "HTML validation passed"

      - name: Check for debug leftovers
        run: |
          echo "Scanning for debug artifacts..."
          ! grep -rn "TODO\|FIXME\|console\.log\|debugger" \
            --include="*.html" --include="*.css" --include="*.js" . \
            | grep -v node_modules \
            | grep -v ".github" \
            || (echo "Debug artifacts found" && exit 1)
          echo "No debug artifacts found"

      - name: Verify config files present
        run: |
          files=("index.html" "css/main.css" "js/app.js" "robots.txt" "sitemap.xml" "404.html")
          for f in "${files[@]}"; do
            test -f "$f" || (echo "Missing required file: $f" && exit 1)
            echo "Found: $f"
          done

      - name: Check .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo ".env file is tracked by git - remove it immediately!"
            exit 1
          fi
          echo ".env is not committed"

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.ref == 'refs/heads/dev'
    environment:
      name: staging
      url: https://staging.mysite.com

    steps:
      - name: Deploy to staging server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.STAGING_HOST }}
          username:    ${{ secrets.SSH_USER }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          port:        ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /var/www/mysite-staging
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            docker compose --profile prod pull
            docker compose --profile prod up -d --no-deps --force-recreate web
            docker image prune -f

      - name: Smoke test staging
        run: |
          sleep 10
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://staging.mysite.com)
          if [ "$STATUS" != "200" ]; then
            echo "Staging smoke test failed - HTTP $STATUS"
            exit 1
          fi
          echo "Staging is healthy (HTTP $STATUS)"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://mysite.com

    steps:
      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /var/www/mysite
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker compose --profile prod pull
            docker compose --profile prod up -d --no-deps --force-recreate web
            docker image prune -f

      - name: Production smoke test
        run: |
          sleep 15
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://mysite.com)
          if [ "$STATUS" != "200" ]; then
            echo "Production smoke test failed - HTTP $STATUS"
            exit 1
          fi
          echo "Production is healthy (HTTP $STATUS)"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "MySite deployed to production by @${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "MySite production deploy FAILED"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
